name: Job Bot

on:

  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'

  workflow_dispatch:

# Needed so the workflow can commit the updated seen_jobs.json back to the repo.
permissions:
  contents: write

# Never let two runs race for seen_jobs.json
concurrency:
  group: job-bot
  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TOKEN: ${{ secrets.TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        run: python main.py


      - name: Commit Updated Seen Jobs

        run: |

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add seen_jobs.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update seen jobs"

          # Keep the branch up to date in case something else pushed meanwhile
          git pull --rebase origin main
          git push
